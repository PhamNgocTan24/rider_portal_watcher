## docker-compose.test.yml
## Run the full test suite inside Docker containers.
##
## Usage (run both suites):
##   # API tests (requires postgres):
##   docker compose -f docker-compose.test.yml --profile api up --build --abort-on-container-exit --exit-code-from test-api
##
##   # Worker tests (no DB needed — uses mocks):
##   docker compose -f docker-compose.test.yml --profile worker up --build --abort-on-container-exit --exit-code-from test-worker
##
## Cleanup:
##   docker compose -f docker-compose.test.yml down -v

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rideportal_test
      POSTGRES_USER: rideportal
      POSTGRES_PASSWORD: rideportal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rideportal -d rideportal_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: ["api"]

  test-api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.test
    environment:
      DATABASE_URL: postgresql+asyncpg://rideportal:rideportal@postgres-test:5432/rideportal_test
      POSTGRES_HOST: postgres-test
      POSTGRES_PORT: "5432"
      POSTGRES_DB: rideportal_test
      POSTGRES_USER: rideportal
      POSTGRES_PASSWORD: rideportal
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
    depends_on:
      postgres-test:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && python -m pytest tests/ -v --tb=short"
    profiles: ["api"]

  test-worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile.test
    environment:
      API_BASE_URL: http://localhost:8000
      FAKE_PORTAL_BASE_URL: http://localhost:3000
      FAKE_PORTAL_USERNAME: demo
      FAKE_PORTAL_PASSWORD: demo123
      WORKER_HEADLESS: "true"
      WORKER_POLL_INTERVAL_SECONDS: "10"
      WORKER_SCREENSHOT_DIR: /tmp/screenshots
      WORKER_HTML_SNAPSHOT_DIR: /tmp/html_snapshots
    command: >
      sh -c "python -m pytest tests/ -v --tb=short"
    profiles: ["worker"]
